<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 980 760" font-family="Helvetica, Arial, sans-serif">
<title>Connection diagram - USART-controlled 8-LED array on NUCLEO-L053R8</title>
<rect x="0" y="0" width="980" height="760" fill="#FFFFFF"/>
<text x="490" y="38" text-anchor="middle" font-size="19" font-weight="600" fill="#1A1A18">Connection Diagram</text>
<text x="490" y="60" text-anchor="middle" font-size="13" fill="#6B6A66">USART-controlled 8-LED array · NUCLEO-L053R8 · serial over the ST-LINK virtual COM port</text>
<rect x="40" y="86" width="900" height="84" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<text x="490" y="112" text-anchor="middle" font-size="16" font-weight="600" fill="#26215C">NUCLEO-L053R8</text>
<text x="490" y="133" text-anchor="middle" font-size="12" fill="#534AB7">USART2 on PA2 / PA3 reaches the host through the on-board ST-LINK — no serial wiring needed</text>
<text x="490" y="152" text-anchor="middle" font-size="12" fill="#534AB7">Powered over USB only · nothing on the breadboard red (+) rail</text>
