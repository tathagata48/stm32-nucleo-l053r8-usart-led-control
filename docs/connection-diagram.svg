<text x="40" y="708" font-size="12" font-weight="700" fill="#1A1A18">Each LED branch:</text>
<text x="166" y="708" font-size="12" fill="#444441">pin → 330 Ω resistor → LED long leg · LED short leg (bar side) → blue rail</text>
<text x="40" y="730" font-size="12" font-weight="700" fill="#854F0B">PB3, PB4, PA2 and PA3 avoided:</text>
<text x="248" y="730" font-size="12" fill="#444441">PB3 / PB4 carry SWO and NJTRST; PA2 / PA3 are the virtual COM port.</text>
