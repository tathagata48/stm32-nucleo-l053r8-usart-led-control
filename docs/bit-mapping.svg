<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 980 560" font-family="Helvetica, Arial, sans-serif">
<title>Bit-to-pin mapping for the 8-LED array</title>
<rect x="0" y="0" width="980" height="560" fill="#FFFFFF"/>
<text x="490" y="36" text-anchor="middle" font-size="19" font-weight="600" fill="#1A1A18">Bit-to-Pin Mapping</text>
<text x="490" y="58" text-anchor="middle" font-size="13" fill="#6B6A66">led_pin[i] holds the GPIOB pin that carries bit i — the sequence is deliberately non-contiguous</text>
<text x="40" y="94" font-size="12.5" font-weight="700" fill="#1A1A18">Value byte</text>
<text x="128" y="94" font-size="11.5" fill="#6B6A66">as written by P&lt;n&gt;, or reported MSB-first by Q</text>
<rect x="48" y="104" width="80" height="46" rx="6" fill="#E4F0FB" stroke="#2C6DA8" stroke-width="1.2"/>
<text x="88" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#14415F">bit 7</text>
<text x="88" y="143" text-anchor="middle" font-size="10.5" fill="#2C6DA8">128</text>
<rect x="148" y="104" width="80" height="46" rx="6" fill="#E4F0FB" stroke="#2C6DA8" stroke-width="1.2"/>
<text x="188" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#14415F">bit 6</text>
<text x="188" y="143" text-anchor="middle" font-size="10.5" fill="#2C6DA8">64</text>
<rect x="248" y="104" width="80" height="46" rx="6" fill="#E4F0FB" stroke="#2C6DA8" stroke-width="1.2"/>
<text x="288" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#14415F">bit 5</text>
<text x="288" y="143" text-anchor="middle" font-size="10.5" fill="#2C6DA8">32</text>
<rect x="348" y="104" width="80" height="46" rx="6" fill="#E4F0FB" stroke="#2C6DA8" stroke-width="1.2"/>
<text x="388" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#14415F">bit 4</text>
<text x="388" y="143" text-anchor="middle" font-size="10.5" fill="#2C6DA8">16</text>
<rect x="448" y="104" width="80" height="46" rx="6" fill="#E4F0FB" stroke="#2C6DA8" stroke-width="1.2"/>
<text x="488" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#14415F">bit 3</text>
<text x="488" y="143" text-anchor="middle" font-size="10.5" fill="#2C6DA8">8</text>
<rect x="548" y="104" width="80" height="46" rx="6" fill="#E4F0FB" stroke="#2C6DA8" stroke-width="1.2"/>
<text x="588" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#14415F">bit 2</text>
<text x="588" y="143" text-anchor="middle" font-size="10.5" fill="#2C6DA8">4</text>
<rect x="648" y="104" width="80" height="46" rx="6" fill="#E4F0FB" stroke="#2C6DA8" stroke-width="1.2"/>
<text x="688" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#14415F">bit 1</text>
<text x="688" y="143" text-anchor="middle" font-size="10.5" fill="#2C6DA8">2</text>
<rect x="748" y="104" width="80" height="46" rx="6" fill="#E4F0FB" stroke="#2C6DA8" stroke-width="1.2"/>
<text x="788" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#14415F">bit 0</text>
<text x="788" y="143" text-anchor="middle" font-size="10.5" fill="#2C6DA8">1</text>
<path d="M88,150 C88,200 688,214 688,266" fill="none" stroke="#7A72D6" stroke-width="1.5" opacity="0.85"/>
<path d="M188,150 C188,200 588,214 588,266" fill="none" stroke="#7A72D6" stroke-width="1.5" opacity="0.85"/>
<path d="M288,150 C288,200 488,214 488,266" fill="none" stroke="#7A72D6" stroke-width="1.5" opacity="0.85"/>
<path d="M388,150 C388,200 788,214 788,266" fill="none" stroke="#7A72D6" stroke-width="1.5" opacity="0.85"/>
<path d="M488,150 C488,200 388,214 388,266" fill="none" stroke="#7A72D6" stroke-width="1.5" opacity="0.85"/>
<path d="M588,150 C588,200 288,214 288,266" fill="none" stroke="#7A72D6" stroke-width="1.5" opacity="0.85"/>
<path d="M688,150 C688,200 188,214 188,266" fill="none" stroke="#7A72D6" stroke-width="1.5" opacity="0.85"/>
<path d="M788,150 C788,200 88,214 88,266" fill="none" stroke="#7A72D6" stroke-width="1.5" opacity="0.85"/>
<rect x="48" y="266" width="80" height="38" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<text x="88" y="290" text-anchor="middle" font-size="13.5" font-weight="700" fill="#26215C">PB0</text>
<rect x="148" y="266" width="80" height="38" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<text x="188" y="290" text-anchor="middle" font-size="13.5" font-weight="700" fill="#26215C">PB1</text>
<rect x="248" y="266" width="80" height="38" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<text x="288" y="290" text-anchor="middle" font-size="13.5" font-weight="700" fill="#26215C">PB2</text>
<rect x="348" y="266" width="80" height="38" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<text x="388" y="290" text-anchor="middle" font-size="13.5" font-weight="700" fill="#26215C">PB5</text>
<rect x="448" y="266" width="80" height="38" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<text x="488" y="290" text-anchor="middle" font-size="13.5" font-weight="700" fill="#26215C">PB8</text>
<rect x="548" y="266" width="80" height="38" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<text x="588" y="290" text-anchor="middle" font-size="13.5" font-weight="700" fill="#26215C">PB9</text>
<rect x="648" y="266" width="80" height="38" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<text x="688" y="290" text-anchor="middle" font-size="13.5" font-weight="700" fill="#26215C">PB10</text>
<rect x="748" y="266" width="80" height="38" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<text x="788" y="290" text-anchor="middle" font-size="13.5" font-weight="700" fill="#26215C">PB13</text>
<text x="40" y="256" font-size="12.5" font-weight="700" fill="#1A1A18">GPIOB output pins</text>
<text x="490" y="334" text-anchor="middle" font-size="11.5" fill="#854F0B">PB3 and PB4 are skipped — they carry SWO and NJTRST, so the run jumps from PB2 straight to PB5.</text>
<text x="490" y="352" text-anchor="middle" font-size="11.5" fill="#6B6A66">LED_MASK = 0x2727 covers exactly these eight bits, so a write never disturbs the rest of GPIOB.</text>
<line x1="40" y1="376" x2="940" y2="376" stroke="#D3D1C7" stroke-width="1"/>
<text x="40" y="402" font-size="12.5" font-weight="700" fill="#1A1A18">Worked example</text>
<text x="150" y="402" font-size="12" fill="#6B6A66">sending P170 lights the alternating pattern; Q then replies 10101010</text>
<text x="88" y="434" text-anchor="middle" font-size="14" font-weight="700" fill="#14415F">1</text>
