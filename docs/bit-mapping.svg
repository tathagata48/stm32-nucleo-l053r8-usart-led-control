<text x="388" y="434" text-anchor="middle" font-size="14" font-weight="700" fill="#8A8880">0</text>
<circle cx="388" cy="470" r="17" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="2"/>
<text x="388" y="510" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8A8880">PB13</text>
<text x="488" y="434" text-anchor="middle" font-size="14" font-weight="700" fill="#14415F">1</text>
<circle cx="488" cy="470" r="17" fill="#FBE3E0" stroke="#BC2F1E" stroke-width="2"/>
<circle cx="488" cy="470" r="7" fill="#BC2F1E"/>
<text x="488" y="510" text-anchor="middle" font-size="11.5" font-weight="600" fill="#26215C">PB5</text>
<text x="588" y="434" text-anchor="middle" font-size="14" font-weight="700" fill="#8A8880">0</text>
<circle cx="588" cy="470" r="17" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="2"/>
<text x="588" y="510" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8A8880">PB2</text>
<text x="688" y="434" text-anchor="middle" font-size="14" font-weight="700" fill="#14415F">1</text>
<circle cx="688" cy="470" r="17" fill="#FBE3E0" stroke="#BC2F1E" stroke-width="2"/>
<circle cx="688" cy="470" r="7" fill="#BC2F1E"/>
<text x="688" y="510" text-anchor="middle" font-size="11.5" font-weight="600" fill="#26215C">PB1</text>
<text x="788" y="434" text-anchor="middle" font-size="14" font-weight="700" fill="#8A8880">0</text>
<circle cx="788" cy="470" r="17" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="2"/>
<text x="788" y="510" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8A8880">PB0</text>
<text x="490" y="540" text-anchor="middle" font-size="11" fill="#8A8880">filled = LED on · read left to right, most significant bit first</text>
</svg>
