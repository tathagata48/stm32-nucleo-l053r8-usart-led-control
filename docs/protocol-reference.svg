<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 980 720" font-family="Helvetica, Arial, sans-serif">
<title>Command protocol reference</title>
<rect x="0" y="0" width="980" height="720" fill="#FFFFFF"/>
<text x="490" y="36" text-anchor="middle" font-size="19" font-weight="600" fill="#1A1A18">Command Protocol</text>
<text x="490" y="58" text-anchor="middle" font-size="13" fill="#6B6A66">One command per line, terminated by CR or LF · USART2 at 19200 8N1 · letters are case-insensitive</text>
<rect x="40" y="88" width="900" height="34" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="54" y="110" font-size="11.5" font-weight="700" fill="#2C2C2A">Command</text>
<text x="196" y="110" font-size="11.5" font-weight="700" fill="#2C2C2A">What it does</text>
<text x="554" y="110" font-size="11.5" font-weight="700" fill="#2C2C2A">Reply</text>
<text x="790" y="110" font-size="11.5" font-weight="700" fill="#2C2C2A">LEDs after</text>
<rect x="40" y="122" width="900" height="50" fill="#FFFFFF"/>
<line x1="40" y1="172" x2="940" y2="172" stroke="#D3D1C7" stroke-width="1"/>
<text x="54" y="153" font-size="13" font-weight="700" fill="#26215C" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">E&lt;text&gt;</text>
<text x="196" y="153" font-size="12" fill="#2C2C2A">Echo — the whole packet is sent straight back</text>
<text x="554" y="153" font-size="12" fill="#0F6E56" font-weight="400">the packet, unchanged</text>
<text x="790" y="153" font-size="11.5" fill="#6B6A66">unchanged</text>
<rect x="40" y="172" width="900" height="50" fill="#FBFAF7"/>
<line x1="40" y1="222" x2="940" y2="222" stroke="#D3D1C7" stroke-width="1"/>
<text x="54" y="203" font-size="13" font-weight="700" fill="#26215C" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">N</text>
<text x="196" y="203" font-size="12" fill="#2C2C2A">All LEDs on (0xFF written to the pin mask)</text>
<text x="554" y="203" font-size="12" fill="#0F6E56" font-weight="400">N</text>
<text x="790" y="203" font-size="11.5" fill="#6B6A66">all 8 lit</text>
<rect x="40" y="222" width="900" height="50" fill="#FFFFFF"/>
<line x1="40" y1="272" x2="940" y2="272" stroke="#D3D1C7" stroke-width="1"/>
<text x="54" y="253" font-size="13" font-weight="700" fill="#26215C" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">F</text>
<text x="196" y="253" font-size="12" fill="#2C2C2A">All LEDs off (0x00 written to the pin mask)</text>
<text x="554" y="253" font-size="12" fill="#0F6E56" font-weight="400">F</text>
<text x="790" y="253" font-size="11.5" fill="#6B6A66">all 8 dark</text>
<rect x="40" y="272" width="900" height="50" fill="#FBFAF7"/>
<line x1="40" y1="322" x2="940" y2="322" stroke="#D3D1C7" stroke-width="1"/>
<text x="54" y="303" font-size="13" font-weight="700" fill="#26215C" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">P&lt;0-255&gt;</text>
<text x="196" y="303" font-size="12" fill="#2C2C2A">Show a decimal byte as an 8-bit pattern</text>
<text x="554" y="303" font-size="12" fill="#0F6E56" font-weight="400">the command, or ERR if invalid</text>
<text x="790" y="303" font-size="11.5" fill="#6B6A66">pattern shown</text>
<rect x="40" y="322" width="900" height="50" fill="#FFFFFF"/>
<line x1="40" y1="372" x2="940" y2="372" stroke="#D3D1C7" stroke-width="1"/>
<text x="54" y="353" font-size="13" font-weight="700" fill="#26215C" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">Q</text>
<text x="196" y="353" font-size="12" fill="#2C2C2A">Query what the LEDs are showing right now</text>
<text x="554" y="353" font-size="12" fill="#0F6E56" font-weight="400">8 binary digits, MSB first</text>
<text x="790" y="353" font-size="11.5" fill="#6B6A66">unchanged</text>
<rect x="40" y="372" width="900" height="50" fill="#FBFAF7"/>
<line x1="40" y1="422" x2="940" y2="422" stroke="#D3D1C7" stroke-width="1"/>
<text x="54" y="403" font-size="11.5" font-weight="700" fill="#8A2015" font-family="Helvetica, Arial, sans-serif">anything else</text>
<text x="196" y="403" font-size="12" fill="#2C2C2A">Unknown letter, bad P argument, or a line over 31 chars</text>
<text x="554" y="403" font-size="12" fill="#BC2F1E" font-weight="700">ERR</text>
<text x="790" y="403" font-size="11.5" fill="#6B6A66">unchanged</text>
<rect x="40" y="88" width="900" height="334" rx="6" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<line x1="182" y1="88" x2="182" y2="422" stroke="#D3D1C7" stroke-width="1"/>
<line x1="540" y1="88" x2="540" y2="422" stroke="#D3D1C7" stroke-width="1"/>
<line x1="776" y1="88" x2="776" y2="422" stroke="#D3D1C7" stroke-width="1"/>
<text x="40" y="456" font-size="12.5" font-weight="700" fill="#1A1A18">Example session</text>
<text x="170" y="456" font-size="11.5" fill="#6B6A66">as seen in a serial terminal on the ST-LINK virtual COM port</text>
<rect x="40" y="470" width="900" height="196" rx="8" fill="#FBFAF7" stroke="#D3D1C7" stroke-width="1"/>
<text x="70" y="496" font-size="10.5" font-weight="700" fill="#534AB7" letter-spacing="0.8">YOU SEND</text>
<text x="510" y="496" font-size="10.5" font-weight="700" fill="#0F6E56" letter-spacing="0.8">BOARD REPLIES</text>
<line x1="490" y1="484" x2="490" y2="652" stroke="#D3D1C7" stroke-width="1"/>
<text x="70" y="522" font-size="13" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#26215C">Ehello world</text>
<text x="510" y="522" font-size="13" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#0A4D3C">Ehello world</text>
<text x="70" y="546" font-size="13" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#26215C">N</text>
<text x="510" y="546" font-size="13" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#0A4D3C">N</text>
<text x="70" y="570" font-size="13" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#26215C">P170</text>
<text x="510" y="570" font-size="13" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#0A4D3C">P170</text>
<text x="70" y="594" font-size="13" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#26215C">Q</text>
<text x="510" y="594" font-size="13" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#0A4D3C">10101010</text>
<text x="70" y="618" font-size="13" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#26215C">F</text>
<text x="510" y="618" font-size="13" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#0A4D3C">F</text>
<text x="70" y="642" font-size="13" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#26215C">Z</text>
<text x="510" y="642" font-size="13" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#8A2015">ERR</text>
<text x="490" y="690" text-anchor="middle" font-size="11" fill="#8A8880">Every reply is terminated with CR LF. On reset the board announces itself with “STM32 ready”.</text>
</svg>
